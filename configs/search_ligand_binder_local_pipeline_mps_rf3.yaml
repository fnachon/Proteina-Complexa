# Ligand Binder Design Pipeline Configuration (Apple Silicon / MPS + RF3 preset)
#
# Extends the MPS preset and enables RF3-based binder refolding metrics.
# Requires:
#   - RF3_EXEC_PATH
#   - RF3_CKPT_PATH
#
# Usage:
#   complexa design configs/search_ligand_binder_local_pipeline_mps_rf3.yaml ++generation.task_name=39_7V11_LIGAND

defaults:
  - search_ligand_binder_local_pipeline_mps
  - _self_

run_name: search_ligand_binder_local_mps_rf3

metric:
  compute_binder_metrics: true
  binder_folding_method: rf3_latest
  compute_monomer_metrics: true
  compute_esm_metrics: true
  sequence_types: [self]

aggregation:
  analysis_modes: [binder, monomer]
