# Protein Binder Design Pipeline Configuration (Apple Silicon / MPS preset)
#
# This preset extends the standard local binder pipeline with MPS-friendly
# defaults while keeping reward-guided search and refinement enabled.
# Requires:
#   - RF3_EXEC_PATH
#   - RF3_CKPT_PATH
#
# Usage:
#   complexa design configs/search_binder_local_pipeline_mps.yaml ++generation.task_name=38_TNFalpha

defaults:
  - search_binder_local_pipeline
  - _self_

run_name: search_binder_local_mps

env_vars:
  PYTORCH_ENABLE_MPS_FALLBACK: "1"
  COMPLEXA_ACCELERATOR: "mps"

# Keep one process per stage for stable memory use on Apple Silicon.
gen_njobs: 1
eval_njobs: 1

generation:
  search:
    algorithm: best-of-n
  reward_model:
    _target_: "proteinfoundation.rewards.base_reward.CompositeRewardModel"
    reward_models:
      rf3folding:
        _target_: "proteinfoundation.rewards.rf3_reward.RF3RewardRunner"
        ckpt_path: ${oc.env:RF3_CKPT_PATH}
        rf3_path: ${oc.env:RF3_EXEC_PATH}
        normalize_pae: true
        reward_weights:
          min_ipAE: -1.0
          plddt: 0.0
          ipAE: 0.0
          mean_min_ipAE: 0.0
          mean_ipAE: 0.0
          min_mean_ipAE: 0.0
          pAE: 0.0
          ipTM: 0.0
          pTM: 0.0
          ranking_score: 0.0
          has_clash: 0.0
          min_ipSAE: 0.0
          max_ipSAE: 0.0
          avg_ipSAE: 0.0
  refinement:
    algorithm: sequence_hallucination

metric:
  compute_binder_metrics: true
  binder_folding_method: rf3_latest
  compute_monomer_metrics: true
  compute_esm_metrics: true

aggregation:
  analysis_modes: [binder, monomer]
