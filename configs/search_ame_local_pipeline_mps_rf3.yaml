# AME (Motif + Ligand Binder) Design Pipeline Configuration (Apple Silicon / MPS + RF3 preset)
#
# Extends the MPS preset and enables RF3-based motif-binder refolding metrics.
# Requires:
#   - RF3_EXEC_PATH
#   - RF3_CKPT_PATH
#
# Usage:
#   complexa design configs/search_ame_local_pipeline_mps_rf3.yaml ++generation.task_name=M0096_1chm

defaults:
  - search_ame_local_pipeline_mps
  - _self_

run_name: search_ame_local_mps_rf3

metric:
  compute_motif_binder_metrics: true
  binder_folding_method: rf3_latest
  compute_monomer_metrics: true
  compute_esm_metrics: true
  sequence_types: [self]

aggregation:
  analysis_modes: [motif_binder, monomer]
