# Ligand Binder Design Pipeline Configuration (Apple Silicon / MPS preset)
#
# This preset extends the standard local ligand-binder pipeline with MPS-friendly
# defaults that avoid RF3-dependent reward-guided search and binder refolding
# during evaluation.
#
# Usage:
#   complexa design configs/search_ligand_binder_local_pipeline_mps.yaml ++generation.task_name=39_7V11_LIGAND

defaults:
  - search_ligand_binder_local_pipeline
  - _self_

run_name: search_ligand_binder_local_mps

env_vars:
  PYTORCH_ENABLE_MPS_FALLBACK: "1"

gen_njobs: 1
eval_njobs: 1

generation:
  search:
    algorithm: single-pass
  reward_model: null
  refinement:
    algorithm: null

metric:
  # Disable binder refolding metrics (RF3 path) for the MPS preset.
  compute_binder_metrics: false
  compute_monomer_metrics: true
  compute_esm_metrics: true
  sequence_types: [self]

aggregation:
  analysis_modes: [monomer]
